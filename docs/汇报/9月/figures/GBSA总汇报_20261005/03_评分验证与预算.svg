<svg aria-labelledby="chart-title-report_figure_2" aria-describedby="chart-desc-report_figure_2" aria-roledescription="flowchart-v2" role="graphics-document document" viewBox="0 0 890.5 1326" height="1326" class="flowchart" xmlns="http://www.w3.org/2000/svg" width="890.5" id="report_figure_2"><title id="chart-title-report_figure_2">共享评分接口的验证与预算流程</title><desc id="chart-desc-report_figure_2">子代经过序列约束和历史排重后，只对没有缓存的新序列计数与预测。缓存必须属于同一固定模型。新评分和谱系写入档案，再反馈算法或停止。</desc><style>#report_figure_2{font-family:Microsoft YaHei,Segoe UI,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#report_figure_2 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#report_figure_2 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#report_figure_2 .error-icon{fill:#552222;}#report_figure_2 .error-text{fill:#552222;stroke:#552222;}#report_figure_2 .edge-thickness-normal{stroke-width:1px;}#report_figure_2 .edge-thickness-thick{stroke-width:3.5px;}#report_figure_2 .edge-pattern-solid{stroke-dasharray:0;}#report_figure_2 .edge-thickness-invisible{stroke-width:0;fill:none;}#report_figure_2 .edge-pattern-dashed{stroke-dasharray:3;}#report_figure_2 .edge-pattern-dotted{stroke-dasharray:2;}#report_figure_2 .marker{fill:#333333;stroke:#333333;}#report_figure_2 .marker.cross{stroke:#333333;}#report_figure_2 svg{font-family:Microsoft YaHei,Segoe UI,sans-serif;font-size:16px;}#report_figure_2 p{margin:0;}#report_figure_2 .label{font-family:Microsoft YaHei,Segoe UI,sans-serif;color:#333;}#report_figure_2 .cluster-label text{fill:#333;}#report_figure_2 .cluster-label span{color:#333;}#report_figure_2 .cluster-label span p{background-color:transparent;}#report_figure_2 .label text,#report_figure_2 span{fill:#333;color:#333;}#report_figure_2 .node rect,#report_figure_