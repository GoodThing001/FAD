<svg aria-labelledby="chart-title-report_figure_4" aria-describedby="chart-desc-report_figure_4" aria-roledescription="flowchart-v2" role="graphics-document document" viewBox="0 0 602 1062" height="1062" class="flowchart" xmlns="http://www.w3.org/2000/svg" width="602" id="report_figure_4"><title id="chart-title-report_figure_4">多路径束搜索的每代流程</title><desc id="chart-desc-report_figure_4">父本扩展的一位点与两位点子代，加全局随机重启，经共享验证评分后与旧父本合并。按预测排名和软多样性规则保留下一代，直到预算、代数或停滞条件满足。</desc><style>#report_figure_4{font-family:Microsoft YaHei,Segoe UI,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#report_figure_4 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#report_figure_4 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#report_figure_4 .error-icon{fill:#552222;}#report_figure_4 .error-text{fill:#552222;stroke:#552222;}#report_figure_4 .edge-thickness-normal{stroke-width:1px;}#report_figure_4 .edge-thickness-thick{stroke-width:3.5px;}#report_figure_4 .edge-pattern-solid{stroke-dasharray:0;}#report_figure_4 .edge-thickness-invisible{stroke-width:0;fill:none;}#report_figure_4 .edge-pattern-dashed{stroke-dasharray:3;}#report_figure_4 .edge-pattern-dotted{stroke-dasharray:2;}#report_figure_4 .marker{fill:#333333;stroke:#333333;}#report_figure_4 .marker.cross{stroke:#333333;}#report_figure_4 svg{font-family:Microsoft YaHei,Segoe UI,sans-serif;font-size:16px;}#report_figure_4 p{margin:0;}#report_figure_4 .label{font-family:Microsoft YaHei,Segoe UI,sans-serif;color:#333;}#report_figure_4 .cluster-label text{fill:#333;}#report_figure_4 .cluster-label span{color:#333;}#report_figure_4 .cluster-label span p{background-color:transparent;}#report_figure_4 .label text,#report_figure_4 span{fill:#333;color:#333;}#report_figure_4 .node rect,#report_figure_