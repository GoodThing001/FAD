<svg aria-labelledby="chart-title-report_figure_5" aria-describedby="chart-desc-report_figure_5" aria-roledescription="flowchart-v2" role="graphics-document document" viewBox="0 0 575.8515625 1626" height="1626" class="flowchart" xmlns="http://www.w3.org/2000/svg" width="575.8515625" id="report_figure_5"><title id="chart-title-report_figure_5">已实现的单亲变异遗传算法</title><desc id="chart-desc-report_figure_5">共同十六条起点评分后形成种群。每代局部子代由二人锦标赛选择一个父本，以一或两位点变异产生；少量全局重启没有父本。过滤后调用固定评分器，父子合并保留两个精英并兼顾多样性。预算、代数或停滞停止后输出完整谱系和一或两组候选。</desc><style>#report_figure_5{font-family:Microsoft YaHei,Segoe UI,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#report_figure_5 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#report_figure_5 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#report_figure_5 .error-icon{fill:#552222;}#report_figure_5 .error-text{fill:#552222;stroke:#552222;}#report_figure_5 .edge-thickness-normal{stroke-width:1px;}#report_figure_5 .edge-thickness-thick{stroke-width:3.5px;}#report_figure_5 .edge-pattern-solid{stroke-dasharray:0;}#report_figure_5 .edge-thickness-invisible{stroke-width:0;fill:none;}#report_figure_5 .edge-pattern-dashed{stroke-dasharray:3;}#report_figure_5 .edge-pattern-dotted{stroke-dasharray:2;}#report_figure_5 .marker{fill:#333333;stroke:#333333;}#report_figure_5 .marker.cross{stroke:#333333;}#report_figure_5 svg{font-family:Microsoft YaHei,Segoe UI,sans-serif;font-size:16px;}#report_figure_5 p{margin:0;}#report_figure_5 .label{font-family:Microsoft YaHei,Segoe UI,sans-serif;color:#333;}#report_figure_5 .cluster-label text{fill:#333;}#report_figure_5 .cluster-label span{color:#333;}#report_figure_5 .cluster-label span p{background-color:transparent;}#report_figure_5 .label text,#report_figure_5 span{fill:#333;color:#333;}#report_figure_5 .node rect,#report_figure_5 .node circle,#report_figure_5 .node ellipse,#report_figure_5 .node polygon,#report_figure_5 .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#report_figure_5 .rough-node .label text,#report_figure_5 .node .label text,#report_figure_5 .image-shape .label,#report_figure_5 .icon-shape .label{text-anchor:middle;}#report_figure_5 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#report_figure_5 .rough-node .label,#report_figure_5 .node .label,#report_figure_5 .image-shape .label,#report_figure_5 .icon-shape .label{text-align:center;}#report_figure_5 .node.clickable{cursor:pointer;}#report_figure_5 .root .anchor path{fill:#333333!important;stroke-width:0;stroke:#333333;}#report_figure_5 .arrowheadPath{fill:#333333;}#report_figure_5 .edgePath .path{stroke:#333333;stroke-width:2.0px;}#report_figure_5 .flowchart-link{stroke:#333333;fill:none;}#report_figure_5 .edgeLabel{background-color:rgba(232,232,232, 0.8);text-align:center;}#report_figure_5 .edgeLabel p{background-color:rgba(232,232,232, 0.8);}#report_figure_5 .edgeLabel rect{opacity:0.5;background-color:rgba(232,232,232, 0.8);fill:rgba(232,232,232, 0.8);}#report_figure_5 .labelBkg{background-color:rgba(232, 232, 232, 0.5);}#report_figure_5 .cluster rect{fill:#ffffde;stroke:#aaaa33;stroke-width:1px;}#report_figure_5 .cluster text{fill:#333;}#report_figure_5 .cluster span{color:#333;}#report_figure_5 div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:Microsoft YaHei,Segoe UI,sans-serif;font-size:12px;background:hsl(80, 100%, 96.2745098039%);border:1px solid #aaaa33;border-radius:2px;pointer-events:none;z-index:100;}#report_figure_5 .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#333;}#report_figure_5 rect.text{fill:none;stroke-width:0;}#report_figure_5 .icon-shape,#report_figure_5 .image-shape{background-color:rgba(232,232,232, 0.8);text-align:center;}#report_figure_5 .icon-shape p,#report_figure_5 .image-shape p{background-color:rgba(232,232,232, 0.8);padding:2px;}#report_figure_5 .icon-shape rect,#report_figure_5 .image-shape rect{opacity:0.5;background-color:rgba(232,232,232, 0.8);fill:rgba(232,232,232, 0.8);}#report_figure_5 .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#report_figure_5 .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#report_figure_5 :root{--mermaid-font-family:Microsoft YaHei,Segoe UI,sans-serif;}</style><g><marker orient="auto" markerHeight="8" markerWidth="8" markerUnits="userSpaceOnUse" refY="5" refX="5" viewBox="0 0 10 10" class="marker flowchart-v2" id="report_figure_5_flowchart-v2-pointEnd"><path style="stroke-width: 1; stroke-dasharray: 1, 0;" class="arrowMarkerPath" d="M 0 0 L 10 5 L 0 10 z"></path></marker><marker orient="auto" markerHeight="8" markerWidth="8" markerUnits="userSpaceOnUse" refY="5" refX="4.5" viewBox="0 0 10 10" class="marker flowchart-v2" id="report_figure_5_flowchart-v2-pointStart"><path style="stroke-width: 1; stroke-dasharray: 1, 0;" class="arrowMarkerPath" d="M 0 5 L 10 10 L 10 0 z"></path></marker><marker orient="auto" markerHeight="11" markerWidth="11" markerUnits="userSpaceOnUse" refY="5" refX="11" viewBox="0 0 10 10" class="marker flowchart-v2" id="report_figure_5_flowchart-v2-circleEnd"><circle style="stroke-width: 1; stroke-dasharray: 1, 0;" class="arrowMarkerPath" r="5" cy="5" cx="5"></circle></marker><marker orient="auto" markerHeight="11" markerWidth="11" markerUnits="userSpaceOnUse" refY="5" refX="-1" viewBox="0 0 10 10" class="marker flowchart-v2" id="report_figure_5_flowchart-v2-circleStart"><circle style="stroke-width: 1; stroke-dasharray: 1, 0;" class="arrowMarkerPath" r="5" cy="5" cx="5"></circle></marker><marker orient="auto" markerHeight="11" markerWidth="11" markerUnits="userSpaceOnUse" refY="5.2" refX="12" viewBox="0 0 11 11" class="marker cross flowchart-v2" id="report_figure_5_flowchart-v2-crossEnd"><path style="stro