<svg aria-labelledby="chart-title-report_figure_7" aria-describedby="chart-desc-report_figure_7" aria-roledescription="flowchart-v2" role="graphics-document document" viewBox="0 0 690.5 1366" height="1366" class="flowchart" xmlns="http://www.w3.org/2000/svg" width="690.5" id="report_figure_7"><title id="chart-title-report_figure_7">未来标签回传的校验与批次状态</title><desc id="chart-desc-report_figure_7">回传先检查候选身份和协议，错误者拒收并继续等待。身份有效的通过行接收 GBSA，质量控制失败行持久化失败。只有全部候选终结才闭合批次，吸收通过标签；运行结束时末次重训才允许 DONE。</desc><style>#report_figure_7{font-family:Microsoft YaHei,Segoe UI,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#report_figure_7 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#report_figure_7 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#report_figure_7 .error-icon{fill:#552222;}#report_figure_7 .error-text{fill:#552222;stroke:#552222;}#report_figure_7 .edge-thickness-normal{stroke-width:1px;}#report_figure_7 .edge-thickness-thick{stroke-width:3.5px;}#report_figure_7 .edge-pattern-solid{stroke-dasharray:0;}#report_figure_7 .edge-thickness-invisible{stroke-width:0;fill:none;}#report_figure_7 .edge-pattern-dashed{stroke-dasharray:3;}#report_figure_7 .edge-pattern-dotted{stroke-dasharray:2;}#report_figure_7 .marker{fill:#333333;stroke:#333333;}#report_figure_7 .marker.cross{stroke:#333333;}#report_figure_7 svg{font-family:Microsoft YaHei,Segoe UI,sans-serif;font-size:16px;}#report_figure_7 p{margin:0;}#report_figure_7 .label{font-family:Microsoft YaHei,Segoe UI,sans-serif;color:#333;}#report_figure_7 .cluster-label text{fill:#333;}#report_figure_7 .cluster-label span{color:#333;}#report_figure_7 .cluster-label span p{background-color:transparent;}#report_figure_7 .label text,#report_figure_7 span{fill:#333;color:#333;}#report_figure_