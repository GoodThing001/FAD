[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fad-riboswitch"
version = "0.1.0"
description = "Reproducible PreQ1/RF00522 riboswitch surrogate modeling mainline"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
boosting = ["xgboost>=2.0", "lightgbm>=4.0"]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

